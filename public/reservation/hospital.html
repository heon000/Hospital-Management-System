<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>병원 목록 조회</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 30px; }
    h1 { color: #1e88e5; }
    input, button { margin: 5px; padding: 8px; font-size: 14px; }
    .hospital { border-bottom: 1px solid #ccc; padding: 10px 0; }
  </style>
</head>
<body>
<div style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999;">
  <button onclick="location.href='/'" class="btn btn-secondary">메인으로</button>
</div>
  <h1>병원 목록</h1>

  <input type="text" id="searchInput" placeholder="병원명을 입력하세요">
  <button onclick="searchHospitals()">검색</button>

  <div id="hospitalList"></div>

  <script>
    let allHospitals = [];

    async function loadHospitals() {
      const res = await fetch("/api/hospitals");
      allHospitals = await res.json();
      renderHospitals(allHospitals);
    }

    function renderHospitals(list) {
      const container = document.getElementById("hospitalList");
      if (list.length === 0) {
        container.innerHTML = "<p>등록되지 않은 병원입니다.</p>";
        return;
      }

      container.innerHTML = list.map(h => `
        <div class="hospital">
          <strong>🏥 병원명:</strong> ${h.name}<br>
          <strong>📍 주소:</strong> ${h.address}<br>
          <strong>📞 연락처:</strong> ${h.phone}
        </div>
      `).join('');
    }

    function searchHospitals() {
      const keyword = document.getElementById("searchInput").value.trim();
      const result = allHospitals.filter(h => h.name.includes(keyword));
      renderHospitals(result);
    }

    loadHospitals();
  </script>
</body>
</html>
