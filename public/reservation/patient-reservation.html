<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환자 진료 예약</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body {
            font-family: '굴림', sans-serif;
            background-color: #e9ecef;
            padding: 10px;
        }
        .container {
            max-width: 95%;
        }
        .search-result:hover { 
            background: #dee2e6; 
            cursor: pointer; 
        }
        .doctor-card { 
            margin-bottom: 8px;
            border: 1px solid #adb5bd;
        }
        .calendar-container { 
            min-height: 350px;
            background-color: #fff;
            border: 1px solid #adb5bd;
            padding: 5px;
        }
        .info-label { 
            font-weight: bold;
            font-size: 13px;
        }
        .card {
            border: 1px solid #adb5bd;
            margin-bottom: 10px;
        }
        .card-header {
            background-color: #e9ecef;
            padding: 8px;
        }
        .form-label {
            font-size: 13px;
            margin-bottom: 2px;
        }
        .form-control, .form-select {
            font-size: 13px;
            padding: 4px 8px;
        }
        .btn {
            border-radius: 2px;
            font-size: 13px;
            padding: 4px 8px;
        }
        .fc-event {
            border: 1px solid #6c757d;
            font-size: 12px;
        }
        .fc-event.available {
            background-color: #a8e6cf;
            border-color: #6c757d;
        }
        .fc-event.unavailable {
            background-color: #ffb3ba;
            border-color: #6c757d;
        }
        .fc-event.pending {
            background-color: #ffd3b6;
            border-color: #6c757d;
        }
    </style>
</head>
<body>
<div style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999;">
  <button onclick="location.href='/'" class="btn btn-secondary">메인으로</button>
</div>
<div class="container mt-4">
    <h2 class="mb-4">진료 예약</h2>
    <!-- 병원 검색 및 선택 -->
    <div class="mb-3">
        <label for="hospitalSearch" class="form-label">병원 검색</label>
        <input type="text" class="form-control" id="hospitalSearch" placeholder="병원명을 입력하세요">
        <div id="hospitalSearchResult" class="list-group"></div>
        <div id="hospitalNotFound" class="text-danger mt-2" style="display:none;">등록되지 않은 병원입니다</div>
    </div>
    <!-- 병원 정보 -->
    <div id="hospitalInfo" class="card mb-3" style="display:none;">
        <div class="card-body">
            <h5 class="card-title" id="hospitalName"></h5>
            <p class="card-text"><span class="info-label">주소:</span> <span id="hospitalAddress"></span></p>
            <p class="card-text"><span class="info-label">연락처:</span> <span id="hospitalContact"></span></p>
        </div>
    </div>
    <!-- 의료진 목록 -->
    <div id="doctorSection" style="display:none;">
        <h5>의료진 선택</h5>
        <div id="doctorList" class="row"></div>
    </div>
    <!-- 스케줄 및 예약 -->
    <div id="scheduleSection" style="display:none;">
        <h5 class="mt-4">의료진 스케줄</h5>
        <div id="doctorScheduleInfo" class="mb-2"></div>
        <div id="calendar" class="calendar-container mb-3"></div>
        <div id="noScheduleMsg" class="alert alert-warning" style="display:none;">예약 불가: 해당 의료진의 스케줄이 없습니다.</div>
        <form id="reservationForm" style="display:none;">
            <div class="mb-2">
                <label class="form-label">예약 날짜</label>
                <input type="text" class="form-control" id="reservationDate" readonly>
            </div>
            <div class="mb-2">
                <label class="form-label">예약 시간</label>
                <select class="form-select" id="reservationTime" required></select>
            </div>
            <div class="mb-2">
                <label class="form-label">환자 이름</label>
                <input type="text" class="form-control" id="patientName" required>
            </div>
            <div class="mb-2">
                <label class="form-label">전화번호</label>
                <div class="input-group">
                    <span class="input-group-text">010</span>
                    <input type="text" class="form-control" id="patientPhone" maxlength="8" pattern="[0-9]{8}" placeholder="숫자 8자리" required>
                </div>
                <div class="form-text">하이픈(-) 없이 숫자 8자리를 입력하세요.</div>
            </div>
            <input type="hidden" id="reservationScheduleId">
            <button type="submit" class="btn btn-primary">예약 신청</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
let hospitals = [];
let selectedHospital = null;
let selectedDoctor = null;
let doctorSchedules = [];
let calendar;

// 병원 검색
async function loadHospitals() {
    const res = await fetch('/api/hospitals');
    hospitals = await res.json();
}

function searchHospital(keyword) {
    const result = hospitals.filter(h => h.name.includes(keyword));
    return result;
}

document.addEventListener('DOMContentLoaded', async function() {
    await loadHospitals();
    document.getElementById('hospitalSearch').addEventListener('input', function() {
        const keyword = this.value.trim();
        const resultDiv = document.getElementById('hospitalSearchResult');
        const notFoundDiv = document.getElementById('hospitalNotFound');
        resultDiv.innerHTML = '';
        notFoundDiv.style.display = 'none';
        document.getElementById('hospitalInfo').style.display = 'none';
        document.getElementById('doctorSection').style.display = 'none';
        document.getElementById('scheduleSection').style.display = 'none';
        if (keyword.length === 0) return;
        const results = searchHospital(keyword);
        if (results.length === 0) {
            notFoundDiv.style.display = 'block';
            return;
        }
        results.forEach(hospital => {
            const item = document.createElement('a');
            item.className = 'list-group-item list-group-item-action search-result';
            item.textContent = hospital.name;
            item.onclick = () => selectHospital(hospital);
            resultDiv.appendChild(item);
        });
    });
});

function selectHospital(hospital) {
    selectedHospital = hospital;
    document.getElementById('hospitalSearchResult').innerHTML = '';
    document.getElementById('hospitalSearch').value = hospital.name;
    document.getElementById('hospitalInfo').style.display = 'block';
    document.getElementById('hospitalName').textContent = hospital.name;
    document.getElementById('hospitalAddress').textContent = hospital.address || '-';
    document.getElementById('hospitalContact').textContent = hospital.phone || '-';
    loadDoctors(hospital._id);
}

// 의료진 목록 불러오기
async function loadDoctors(hospitalId) {
    const res = await fetch(`/api/users?hospitalId=${hospitalId}&role=doctor`);
    const doctors = await res.json();
    const doctorList = document.getElementById('doctorList');
    doctorList.innerHTML = '';
    if (doctors.length === 0) {
        doctorList.innerHTML = '<div class="col">의료진이 없습니다.</div>';
        document.getElementById('doctorSection').style.display = 'block';
        document.getElementById('scheduleSection').style.display = 'none';
        return;
    }
    doctors.forEach(doctor => {
        const card = document.createElement('div');
        card.className = 'col-md-4 doctor-card';
        card.innerHTML = `
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title">${doctor.name}</h6>
                    <p class="card-text">진료과: ${doctor.department || '-'}</p>
                    <button class="btn btn-outline-primary btn-sm" onclick='selectDoctor("${doctor._id}", "${doctor.name}", "${doctor.department}")'>스케줄 보기</button>
                </div>
            </div>
        `;
        doctorList.appendChild(card);
    });
    document.getElementById('doctorSection').style.display = 'block';
    document.getElementById('scheduleSection').style.display = 'none';
}

// 의료진 스케줄 불러오기 및 달력 표시
async function selectDoctor(doctorId, doctorName, department) {
    selectedDoctor = { doctorId, doctorName, department };
    document.getElementById('doctorScheduleInfo').textContent = `${doctorName}`;
    const res = await fetch(`/api/schedules/doctor/${doctorId}`);
    doctorSchedules = await res.json();
    showDoctorSchedule();
}

function showDoctorSchedule() {
    document.getElementById('scheduleSection').style.display = 'block';
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    // status가 'available'인 것만 달력에 표시
    const availableSchedules = doctorSchedules.filter(e => {
        const status = (e.extendedProps && e.extendedProps.status)
            || e.status
            || 'available';
        return status === 'available';
    });
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: availableSchedules,
        eventClick: function(info) {
            const status = (info.event.extendedProps && info.event.extendedProps.status)
                || info.event.status
                || 'available';
            if (status === 'available') {
                showReservationForm(info.event);
            } else if (status === 'pending') {
                alert('이미 예약 신청이 접수된 시간입니다.');
            } else if (status === 'approved') {
                alert('이미 승인된 예약입니다. 예약이 불가합니다.');
            } else if (status === 'cancelled') {
                alert('취소된 스케줄입니다. 예약이 불가합니다.');
            } else {
                alert('예약이 불가한 시간입니다.');
            }
        },
        eventDidMount: function(info) {
            info.el.classList.add(info.event.extendedProps.status);
        }
    });
    calendar.render();
    // 예약 불가 메시지
    const hasAvailable = availableSchedules.length > 0;
    document.getElementById('noScheduleMsg').style.display = hasAvailable ? 'none' : 'block';
    document.getElementById('reservationForm').style.display = 'none';
}

// 예약 폼 표시
function showReservationForm(event) {
    document.getElementById('reservationForm').style.display = 'block';
    document.getElementById('reservationDate').value = new Date(event.start).toLocaleDateString();
    const timeSelect = document.getElementById('reservationTime');
    timeSelect.innerHTML = '';
    
    // 예약 가능한 시간만 표시
    const availableTimes = event.extendedProps.availableTime || [];
    if (availableTimes.length === 0) {
        timeSelect.innerHTML = '<option value="">예약 가능한 시간이 없습니다</option>';
        return;
    }

    availableTimes.forEach(time => {
        const opt = document.createElement('option');
        opt.value = `${time.start}~${time.end}`;
        opt.textContent = `${time.start} ~ ${time.end}`;
        timeSelect.appendChild(opt);
    });
    // scheduleId를 숨은 input에 저장
    document.getElementById('reservationScheduleId').value = event.id || event._id;
}

// 예약 신청
const reservationForm = document.getElementById('reservationForm');
if (reservationForm) {
    reservationForm.onsubmit = async function(e) {
        e.preventDefault();
        
        if (!selectedHospital || !selectedDoctor) {
            alert('병원과 의료진을 선택해주세요.');
            return;
        }

        const patientName = document.getElementById('patientName').value;
        const reservationDate = document.getElementById('reservationDate').value;
        const reservationTime = document.getElementById('reservationTime').value;
        const scheduleId = document.getElementById('reservationScheduleId').value;
        const phoneInput = document.getElementById('patientPhone').value.trim();
        if (!/^\d{8}$/.test(phoneInput)) {
            alert('전화번호는 하이픈(-) 없이 숫자 8자리로 입력해주세요.');
            return;
        }

        if (!patientName || !reservationDate || !reservationTime || !scheduleId) {
            alert('모든 필수 항목을 입력해주세요.');
            return;
        }

        try {
            const response = await fetch('/api/reservations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    hospitalId: selectedHospital._id,
                    doctorId: selectedDoctor.doctorId,
                    patientName: patientName,
                    phoneNumber : phoneInput,
                    date: reservationDate,
                    time: reservationTime,
                    scheduleId: scheduleId
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert('예약이 완료되었습니다.');
                // 폼 초기화
                reservationForm.reset();
                // 달력 새로고침
                showDoctorSchedule();
            } else {
                alert(result.error || '예약에 실패했습니다.');
            }
        } catch (error) {
            console.error('예약 오류:', error);
            alert('예약 처리 중 오류가 발생했습니다.');
        }
    };
}

// 달력 이벤트 스타일
document.addEventListener('DOMContentLoaded', function() {
    const style = document.createElement('style');
    style.textContent = `
        .fc-event.available {
            background-color: #28a745;
            border-color: #28a745;
            cursor: pointer;
        }
        .fc-event.unavailable {
            background-color: #dc3545;
            border-color: #dc3545;
            cursor: not-allowed;
        }
        .fc-event.pending {
            background-color: #ffc107;
            border-color: #ffc107;
            cursor: not-allowed;
        }
    `;
    document.head.appendChild(style);
});
</script>
</body>
</html>
